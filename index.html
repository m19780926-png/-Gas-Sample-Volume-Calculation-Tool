<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>採取量計算ツール</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4CAF50">

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
    background: #eef1f5;
    padding: 20px;
    margin: 0;
}
.app-card {
    background: #ffffff;
    padding: 22px;
    border-radius: 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    max-width: 600px;
    margin: auto;
    display: none;
}
h2 {
    font-size: 30px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 24px;
}
label {
    font-weight: bold;
    margin-top: 12px;
    display: block;
}
input, select {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 18px;
}
.calc-btn {
    width: 100%;
    padding: 14px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 20px;
    margin-top: 20px;
}
.back-btn {
    width: 100%;
    padding: 14px;
    background: #777;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    margin-top: 20px;
}
.result {
    margin-top: 20px;
    font-size: 22px;
    font-weight: bold;
    text-align: center;
}
.formula-card {
    background: #f9f9f9;
    padding: 14px;
    border-radius: 12px;
    margin-top: 20px;
}
.formula-title {
    font-weight: bold;
    margin-bottom: 10px;
}
.fraction {
    display: inline-block;
    text-align: center;
}
.fraction .top {
    border-bottom: 1px solid #000;
    display: block;
}
.fraction .bottom {
    display: block;
}
.menu-btn {
    width: 100%;
    padding: 18px;
    background: #2196F3;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 22px;
    margin-top: 20px;
}
</style>
</head>
<body>

<!-- ▼ ホームメニュー -->
<div id="menu" class="app-card" style="display:block;">
    <h2>採取量計算ツール</h2>

    <button class="menu-btn" onclick="openCard('gas')">
        気体採取量
    </button>

    <button class="menu-btn" onclick="openCard('liquid')">
        薬液採取量
    </button>

    <button class="menu-btn" onclick="openCard('ampule')">
        アンプル採取量
    </button>
</div>



<!-- ▼ 薬液採取量（完成版） -->
<div id="liquid" class="app-card">
    <h2>薬液採取量</h2>

    <label>ガス名</label>
    <select id="gasSelect" onchange="loadGasData()">
        <option value="">選択してください</option>
    </select>

    <label>室温（℃）</label>
    <input type="number" id="roomTemp" step="0.1">

    <label>ガス作製量（L）</label>
    <input type="number" id="gasVolume" step="0.01">

    <label>薬液の分子量</label>
    <input type="number" id="molWeight" step="0.01">

    <label>薬液の比重</label>
    <input type="number" id="density" step="0.001">

    <label>作製濃度（ppm）</label>
    <input type="number" id="makePPM2" step="0.01">

    <button class="calc-btn" onclick="calcLiquid()">計算する</button>

    <!-- ★ 入力値クリアボタン（追加） -->
    <button class="back-btn" style="background:#d9534f;" onclick="clearLiquidInputs()">
        入力値クリア
    </button>

    <div class="result" id="liquidResult"></div>

    <div class="formula-card">
        <div class="formula-title">ガス情報</div>
        ガス名：<span id="infoName"></span><br>
        略名/化学式：<span id="infoShort"></span><br>
        化学式・別名：<span id="infoAlias"></span><br>
        分子量：<span id="infoMW"></span><br>
        比重：<span id="infoDensity"></span><br>
        LEL(vol%)：<span id="infoLEL"></span><br>
        作製ガス濃度（%LEL）：<span id="infoLEL40"></span><br>
        換算濃度(ppm)：<span id="infoPPM"></span>
    </div>

    <button class="back-btn" onclick="backMenu()">← ホームに戻る</button>
</div>

    
    <!-- ▼ 気体採取量 -->
<div id="gas" class="app-card">
    <h2>気体採取量</h2>

    <label>室温（℃）</label>
    <input type="number" id="gasTemp" step="0.1">

    <label>ガス作製量（L）</label>
    <input type="number" id="gasMake" step="0.01">

    <label>作製濃度（ppm）</label>
    <input type="number" id="gasPPM" step="0.01">

    <button class="calc-btn" onclick="calcGas()">計算する</button>

    <div class="result" id="gasResult"></div>

    <button class="back-btn" onclick="backMenu()">← ホームに戻る</button>
</div>


<!-- ▼ アンプル採取量 -->
<div id="ampule" class="app-card">
    <h2>アンプル採取量</h2>

    <label>アンプル濃度（ppm）</label>
    <input type="number" id="ampPPM" step="0.01">

    <label>ガス作製量（L）</label>
    <input type="number" id="ampMake" step="0.01">

    <button class="calc-btn" onclick="calcAmpule()">計算する</button>

    <div class="result" id="ampResult"></div>

    <button class="back-btn" onclick="backMenu()">← ホームに戻る</button>
</div>
<script>
// ▼ 画面切替
function openCard(id){
    menu.style.display = "none";
    gas.style.display = "none";
    liquid.style.display = "none";
    ampule.style.display = "none";
    document.getElementById(id).style.display = "block";
}

function backMenu(){
    gas.style.display = "none";
    liquid.style.display = "none";
    ampule.style.display = "none";
    menu.style.display = "block";
}
// ▼ CSV → JSON化したガスデータベース（完全版）
const gasDB = {
  "OK73シンナー": { short:"OK-73", alias:"C6H1203", mw:99.77, density:0.94, LEL:2.3, LEL40:40, ppm:9200 },
  "アセトン": { short:"C3H6O", alias:"", mw:58.08, density:0.789, LEL:2.15, LEL40:40, ppm:8600 },
  "アクリル酸メチル": { short:"C4H6O2", alias:"", mw:86.09, density:0.956, LEL:2.4, LEL40:40, ppm:9600 },
  "イソプロピルアルコール": { short:"IPA", alias:"C3H8O", mw:60.09, density:0.786, LEL:2, LEL40:40, ppm:8000 },
  "エチルアルコール": { short:"C2H5OH", alias:"エタノール", mw:46.07, density:0.789, LEL:3.3, LEL40:40, ppm:13200 },
  "キシレン": { short:"C8H10", alias:"", mw:106.17, density:0.861, LEL:1, LEL40:40, ppm:4000 },
  "酢酸エチル": { short:"EtAc", alias:"C4H8O2", mw:88.11, density:0.906, LEL:2.1, LEL40:40, ppm:8400 },
  "酢酸ブチル": { short:"C6H12O2", alias:"", mw:116.16, density:0.882, LEL:1.4, LEL40:40, ppm:5600 },
  "酸化プロピレン": { short:"PO", alias:"C3H6O", mw:58.08, density:0.83, LEL:2.8, LEL40:40, ppm:11200 },
  "シクロヘキサノン": { short:"C6H10O", alias:"", mw:98.15, density:0.947, LEL:1.1, LEL40:40, ppm:4400 },
  "シクロヘキサン": { short:"C6H12", alias:"", mw:84.16, density:0.779, LEL:1.3, LEL40:40, ppm:5200 },
  "シクロペンタン": { short:"C5H10", alias:"", mw:70.1, density:0.746, LEL:1.4, LEL40:40, ppm:5600 },
  "1,2-ジクロロエタン": { short:"EDC", alias:"C2H4Cl2", mw:98.97, density:1.28, LEL:6.2, LEL40:40, ppm:24800 },
  "ジクロロメタン": { short:"CH2Cl2", alias:"塩化メチレン", mw:84.94, density:1.335, LEL:13, LEL40:40, ppm:52000 },
  "スチレン": { short:"C8H8", alias:"", mw:104.04, density:0.907, LEL:1.1, LEL40:40, ppm:4400 },
  "ジエチルカーボネート": { short:"C5H10O3", alias:"炭酸ジエチル", mw:118.13, density:0.975, LEL:0, LEL40:0, ppm:0 },
  "ジメチルカーボネート": { short:"C3H6O3", alias:"炭酸ジメチル", mw:90.08, density:1.07, LEL:9.5, LEL40:40, ppm:38000 },
  "テトラヒドロフラン": { short:"THF", alias:"C4H8O", mw:72.1, density:0.888, LEL:2, LEL40:40, ppm:8000 },
  "テトラフルオロエチルトリフルオロエチルエーテル": { short:"C4H3OF7", alias:"", mw:200.05, density:1.487, LEL:0, LEL40:0, ppm:0 },
  "トランス-1,2-ジクロロエチレン": { short:"C2H2Cl2", alias:"", mw:96.94, density:1.257, LEL:0, LEL40:0, ppm:0 },
  "トリエチルアミン": { short:"TEA", alias:"C6H15N", mw:101.19, density:0.725, LEL:1.2, LEL40:40, ppm:4800 },
  "トルエン": { short:"C7H8", alias:"", mw:92.14, density:0.866, LEL:1.2, LEL40:40, ppm:4800 },
  "ノルマルヘキサン": { short:"n-C6H14", alias:"", mw:86.17, density:0.678, LEL:1.2, LEL40:40, ppm:4800 },
  "ノルマルプロピルブロマイド": { short:"C3H7Br", alias:"ABZOL-JG", mw:122.99, density:1.34, LEL:4, LEL40:40, ppm:16000 },
  "PGMME": { short:"C4H10O2", alias:"プロピレングリコールモノメチルエーテル", mw:90.12, density:0.923, LEL:1.6, LEL40:40, ppm:6400 },
  "PGMMEAc": { short:"C6H12O3", alias:"プロピレングリコールモノメチルエーテルアセテート", mw:132.16, density:0.996, LEL:1.3, LEL40:40, ppm:5200 },
  "ベンゼン": { short:"C6H6", alias:"", mw:78.11, density:0.873, LEL:1.2, LEL40:40, ppm:4800 },
  "メチルアルコール": { short:"CH3OH", alias:"メタノール", mw:32.04, density:0.791, LEL:5.5, LEL40:40, ppm:22000 },
  "メチルエチルケトン": { short:"MEK", alias:"C4H8O", mw:72.12, density:0.805, LEL:1.8, LEL40:40, ppm:7200 },
  "メチルシクロヘキサン": { short:"C7H14", alias:"", mw:98.18, density:0.77, LEL:1.15, LEL40:40, ppm:4600 },
  "α-ターピネン": { short:"ATRP", alias:"C10H16", mw:136.23, density:0.84, LEL:0, LEL40:0, ppm:0 }
};

  // ▼ プルダウン自動生成（ガス名 + 略名/化学式 + 別名）
function buildGasSelect() {
    const select = document.getElementById("gasSelect");

    for (const key in gasDB) {
        const g = gasDB[key];

        // 表示名を作成（略名/化学式 + 別名）
        const display =
            `${key}（${g.short}${g.alias ? " / " + g.alias : ""}）`;

        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = display;

        select.appendChild(opt);
    }
}

// ページ読み込み時に実行
buildGasSelect();
  // ▼ ガス選択時に情報＆分子量・比重を反映
function loadGasData() {
    const key = gasSelect.value;
    if (!key || !gasDB[key]) return;

    const g = gasDB[key];

    molWeight.value = g.mw;
    density.value = g.density;

    infoName.innerText = key;
    infoShort.innerText = g.short;
    infoAlias.innerText = g.alias;
    infoMW.innerText = g.mw;
    infoDensity.innerText = g.density;
    infoLEL.innerText = g.LEL;
    infoLEL40.innerText = g.LEL40;
    infoPPM.innerText = g.ppm;
}

// ▼ 薬液採取量計算
function calcLiquid() {
    const t = parseFloat(roomTemp.value);
    const v = parseFloat(gasVolume.value);
    const mw = parseFloat(molWeight.value);
    const ppm = parseFloat(makePPM2.value);
    const d = parseFloat(density.value);

    if (isNaN(t) || isNaN(v) || isNaN(mw) || isNaN(ppm) || isNaN(d) ||
        v <= 0 || mw <= 0 || ppm <= 0 || d <= 0) {
        liquidResult.innerHTML = "入力値が不正です。";
        return;
    }

    const tempFactor = 273 / (273 + t);
    const result = tempFactor * (v * mw * ppm) / (22.4 * 1000 * d);

    liquidResult.innerHTML = "採取量：" + result.toFixed(2) + " μL";
}

// ▼ 気体採取量計算
function calcGas() {
    const t = parseFloat(gasTemp.value);
    const v = parseFloat(gasMake.value);
    const ppm = parseFloat(gasPPM.value);

    if (isNaNaN(t) || isNaN(v) || isNaN(ppm) || v <= 0 || ppm <= 0) {
        gasResult.innerHTML = "入力値が不正です。";
        return;
    }

    const tempFactor = 273 / (273 + t);
    const result = tempFactor * (v * ppm) / (22.4 * 1000);

    gasResult.innerHTML = "採取量：" + result.toFixed(2) + " μL";
}
// ▼ アンプル採取量計算
function calcAmpule() {
    const ppm = parseFloat(ampPPM.value);
    const v = parseFloat(ampMake.value);

    if (isNaN(ppm) || isNaN(v) || ppm <= 0 || v <= 0) {
        ampResult.innerHTML = "入力値が不正です。";
        return;
    }

    const result = (v * ppm) / (22.4 * 1000);

    ampResult.innerHTML = "採取量：" + result.toFixed(2) + " μL";
}
</script>
